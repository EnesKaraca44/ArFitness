<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>Squat Challenge – katmanlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=block" rel="stylesheet">
<!--
  "100 Squat Challenge" reels'i: yapay zekâ ile üretilen gerçekçi görüntünün ÜSTÜNE bindirilecek katmanlar.
  Video modelleri ekrandaki yazıyı bozduğu için uygulama arayüzü ve son kart buradan basılır (render.cmd).

    ?v=hud&n=0&mode=warn      Hülya'nın çeyrek squat'ı: TEKRAR 0 + kırmızı uyarı (şeffaf)
    ?v=hud&n=1&score=98       Hamdi'nin squat'ı: uygulamanın gerçek mesajı "1. tekrar! Form %98" (şeffaf)
    ?v=hud&n=1&msg=mukemmel   Aynı an, senaryodaki metinle: "MÜKEMMEL FORM! 1. tekrar" (şeffaf)
    ?v=cap&t=<metin>          Altyazı (şeffaf; \n satır böler) — uret.py basar
    ?v=end                    Son kart (opak)

  HUD metinleri uygulamadan: SquatAnalyzer.partialMessage ve RepExerciseAnalyzer'daki tekrar mesajı.
-->
<style>
:root{
  --app-blue:#0A84FF; --green:#3FB950; --red:#DF1625; --black:#070707;
  --ui:'Inter','Segoe UI',system-ui,sans-serif;
  --emoji:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji';
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:transparent}
body{position:relative;font-family:var(--ui),var(--emoji);color:#F5F7FA;-webkit-font-smoothing:antialiased}
.view{position:absolute;inset:0;display:none;overflow:hidden}
.view.on{display:block}
.emoji{font-family:var(--emoji);font-weight:400}

/* ---------- UYGULAMA HUD (şeffaf) ---------- */
.h-time{position:absolute;top:300px;right:30px;text-align:right;line-height:1}
.h-time small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#E5E5E5;text-shadow:0 1px 4px #000}
.h-time b{font-size:30px;font-weight:800;color:var(--app-blue);text-shadow:0 1px 5px #000}
.h-rep{position:absolute;left:32px;top:560px;line-height:1}
.h-rep small{display:block;font-size:14px;font-weight:800;letter-spacing:.1em;color:#E5E5E5;text-shadow:0 1px 6px #000;margin-bottom:2px}
.h-rep .num{display:flex;align-items:flex-start;gap:10px}
.h-rep b{font-size:112px;font-weight:800;color:#fff;letter-spacing:-.02em;
  text-shadow:0 4px 8px rgba(0,0,0,.85),0 0 30px rgba(63,185,80,.9),0 0 60px rgba(63,185,80,.5)}
.h-rep .plus{margin-top:14px;padding:5px 10px;border-radius:9px;background:var(--green);color:#04210B;font-size:17px;font-weight:900;
  box-shadow:0 0 20px rgba(63,185,80,.8)}
.h-pill{position:absolute;left:50%;top:722px;transform:translateX(-50%);max-width:440px;width:max-content;text-align:center;
  padding:13px 26px;border-radius:22px;background:rgba(10,132,255,.84);font-size:18px;font-weight:800;line-height:1.3;
  box-shadow:0 8px 30px rgba(0,0,0,.45)}
#hud.warn .h-rep b{text-shadow:0 4px 8px rgba(0,0,0,.85)}
#hud.warn .h-rep .plus{display:none}
#hud.warn .h-pill{background:rgba(218,54,51,.9);box-shadow:0 0 0 2px rgba(255,180,175,.55),0 0 34px rgba(248,81,73,.75)}
#hud.warn .h-pill::before{content:'⚠ ';font-family:var(--emoji)}
#hud.warn .h-edge{position:absolute;inset:0;box-shadow:inset 0 0 50px rgba(248,81,73,.45),inset 0 0 0 3px rgba(248,81,73,.5)}

/* ---------- ALTYAZI (şeffaf) ---------- */
.cap{position:absolute;left:22px;right:22px;top:150px;text-align:center}
.cap span{display:inline;font-size:27px;font-weight:800;line-height:1.6;padding:5px 14px;border-radius:12px;color:#fff;
  background:rgba(0,0,0,.78);-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ---------- SON KART (opak) ---------- */
#end{background:var(--black)}
.e-glow{position:absolute;inset:0;background:
  radial-gradient(62% 26% at 50% 53%,rgba(223,22,37,.20),transparent 72%),
  radial-gradient(80% 22% at 50% 0%,rgba(223,22,37,.10),transparent 70%)}
.e-tag{position:absolute;left:36px;right:36px;top:150px;text-align:center;font-weight:900;font-size:49px;line-height:1.12;letter-spacing:-.02em}
.e-tag em{font-style:normal;color:var(--red);text-shadow:0 0 28px rgba(223,22,37,.55)}
.e-logo{position:absolute;left:50%;top:318px;width:420px;height:420px;margin-left:-210px;mix-blend-mode:lighten}
.e-cta{position:absolute;left:0;right:0;top:668px;text-align:center}
.e-pill{display:inline-flex;align-items:center;gap:12px;padding:15px 30px;border-radius:999px;background:var(--red);
  font-size:21px;font-weight:900;letter-spacing:.02em;box-shadow:0 0 0 1px rgba(255,255,255,.22),0 0 36px rgba(223,22,37,.6)}
.e-pill svg{width:18px;height:20px;display:block}
.e-bio{margin-top:16px;font-size:17px;font-weight:700;color:#C9C9C9}
</style>
</head>
<body>

<section class="view" id="hud">
  <div class="h-edge"></div>
  <div class="h-time"><small>GEÇEN SÜRE</small><b id="hT">00:09</b></div>
  <div class="h-rep"><small>TEKRAR</small><div class="num"><b id="hN">1</b><span class="plus">+1</span></div></div>
  <div class="h-pill" id="hP"></div>
</section>

<section class="view" id="cap"><div class="cap"><span id="capT"></span></div></section>

<section class="view" id="end">
  <div class="e-glow"></div>
  <div class="e-tag">Filtre anca<br>yüzünü düzeltir,<br><em>formunu değil.</em></div>
  <img class="e-logo" src="logo_kirmizi.png" alt="ArFitness">
  <div class="e-cta">
    <div class="e-pill"><svg viewBox="0 0 18 20" aria-hidden="true"><path d="M1 1.2v17.6a1 1 0 0 0 1.5.86l15-8.8a1 1 0 0 0 0-1.72l-15-8.8A1 1 0 0 0 1 1.2z" fill="#fff"/></svg>GOOGLE PLAY'DE</div>
    <div class="e-bio">Link bio'da <span class="emoji">👆</span></div>
  </div>
</section>

<script>
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || 'end';
  const el = document.getElementById(v);
  el.classList.add('on');
  if (v === 'hud') {
    const n = q.get('n') || '1';
    const warn = q.get('mode') === 'warn';
    document.getElementById('hN').textContent = n;
    document.getElementById('hT').textContent = q.get('t') || (warn ? '00:05' : '00:09');
    let text;
    if (warn) {
      el.classList.add('warn');
      text = 'Biraz daha derine in';                                // SquatAnalyzer.partialMessage
    } else if (q.get('msg') === 'mukemmel') {
      text = 'MÜKEMMEL FORM! ' + n + '. tekrar';                    // senaryodaki metin
    } else {
      text = n + '. tekrar! Form %' + (q.get('score') || '98');     // RepExerciseAnalyzer'daki tekrar mesajı
    }
    document.getElementById('hP').textContent = text;
  }
  if (v === 'cap') {
    const span = document.getElementById('capT');
    (q.get('t') || '').split('\n').forEach((line, i) => {
      if (i) span.appendChild(document.createElement('br'));
      span.appendChild(document.createTextNode(line));
    });
  }
</script>
</body>
</html>
